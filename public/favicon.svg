<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#34A65F"/>
  
  <!-- Snowflake - centered and symmetrical -->
  <!-- Main horizontal arm -->
  <line x1="50" y1="20" x2="50" y2="80" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Main vertical arm -->
  <line x1="20" y1="50" x2="80" y2="50" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Diagonal arms -->
  <line x1="30" y1="30" x2="70" y2="70" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <line x1="70" y1="30" x2="30" y2="70" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Branch details on horizontal arm (top) -->
  <line x1="50" y1="20" x2="45" y2="15" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="50" y1="20" x2="55" y2="15" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="50" y1="25" x2="42" y2="22" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="50" y1="25" x2="58" y2="22" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Branch details on horizontal arm (bottom) -->
  <line x1="50" y1="80" x2="45" y2="85" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="50" y1="80" x2="55" y2="85" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="50" y1="75" x2="42" y2="78" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="50" y1="75" x2="58" y2="78" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Branch details on vertical arm (left) -->
  <line x1="20" y1="50" x2="15" y2="45" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="20" y1="50" x2="15" y2="55" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="25" y1="50" x2="22" y2="42" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="25" y1="50" x2="22" y2="58" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Branch details on vertical arm (right) -->
  <line x1="80" y1="50" x2="85" y2="45" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="80" y1="50" x2="85" y2="55" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="75" y1="50" x2="78" y2="42" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="75" y1="50" x2="78" y2="58" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Branch details on diagonal arms -->
  <!-- Top-left to bottom-right diagonal -->
  <line x1="30" y1="30" x2="25" y2="25" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="30" y1="30" x2="35" y2="25" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="35" y1="35" x2="28" y2="32" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="35" y1="35" x2="32" y2="28" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
  
  <line x1="70" y1="70" x2="75" y2="75" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="70" y1="70" x2="65" y2="75" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="65" y1="65" x2="72" y2="68" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="65" y1="65" x2="68" y2="72" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Top-right to bottom-left diagonal -->
  <line x1="70" y1="30" x2="75" y2="25" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="70" y1="30" x2="65" y2="25" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="65" y1="35" x2="72" y2="32" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="65" y1="35" x2="68" y2="28" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
  
  <line x1="30" y1="70" x2="25" y2="75" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="30" y1="70" x2="35" y2="75" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="35" y1="65" x2="28" y2="68" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="35" y1="65" x2="32" y2="72" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Center circle for detail -->
  <circle cx="50" cy="50" r="3" fill="#fff"/>
</svg>
